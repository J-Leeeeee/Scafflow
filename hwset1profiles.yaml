# =============================================================================
# Homework Set 1 — Profile step specs
# Source of truth for updating frontend/src/design/mockSteps.ts
# =============================================================================
#
# HOW TO USE
# 1. Fill prompt / helperText / actionLabel from Figma (unless reuse_from_profile1.copy_prompt is true)
# 2. Pick `kind` from the cheat sheet below
# 3. Use `reuse_from_profile1` on every step — tells an agent exactly what to lift from Profile 1
# 4. Paste this file into Agent mode with: "Update profileNSteps from this YAML"
#
# reuse_from_profile1 fields (per step):
#   step: <1-12> | null     — Profile 1 step with the same learning objective (null = new in this profile)
#   profile1_kind: <kind>   — only when kind_changed: true; the P1 step's interaction type
#   copy_answer: true|false  — copy filled/checked answer values from profile_1_reference
#   copy_feedback: true|false — copy feedback title/body from profile1Steps in mockSteps.ts
#   copy_prompt: true|false  — copy prompt (and usually actionLabel) verbatim from Profile 1
#   kind_changed: true|false — true when this profile uses a different step kind than Profile 1
#   notes: <string>          — optional human/agent hint (e.g. why kind differs)
#
# KIND CHEAT SHEET
#   mcq                 — 4 circuit diagram options (A–D)
#   multi_value         — 1+ text fields (VALUE 1/2, or "Vth =")
#   select_in_diagram   — click node/terminals on circuit
#   numeric_plain       — single number, no unit
#   numeric_unit        — number with V / A / Ω
#   labeled_equations   — KCL or MESH equation lines
#   drawing_task        — interactive canvas (short circuit, label loops)
#   priors_then_input   — shows prior values, then one numeric field
#   dual_numeric_unit   — two numeric fields with units on one screen (e.g. Vth + Rth)
# CIRCUIT OVERLAY VALUES (select_in_diagram / labeled_equations)
#   none | highlight_node_va | highlight_terminals_ab | mesh_loops | mesh_loop_1
#
# MCQ OPTION KINDS
#   voltage_series | current_series | current_parallel | voltage_parallel
# =============================================================================

homework:
  title: Homework Set 1
  goal: Find the Thévenin equivalent at terminals a, b.

# Quick lookup — Profile 1 steps (source for copy_* flags below)
profile_1_reference:
  steps:
    1:  { kind: mcq,                 prompt_key: thevenin_model_mcq }
    2:  { kind: multi_value,         prompt_key: identify_vth_rth,         answer: { values: [Vth, Rth] } }
    3:  { kind: multi_value,         prompt_key: vth_terminals_text,       answer: { values: [Vab] } }
    4:  { kind: select_in_diagram,   prompt_key: choose_ground,            answer: { overlay: highlight_node_va } }
    5:  { kind: numeric_plain,       prompt_key: essential_node_count,     answer: { value: "3" } }
    6:  { kind: numeric_plain,       prompt_key: kcl_equation_count,       answer: { value: "2" } }
    7:  { kind: labeled_equations,   prompt_key: kcl_equations,            answer: { equations: ["(VA-9)/20+(VA-VB)/60-1.8=0", "(VB-VA)/60+VB/25+VB/10=0"] } }
    8:  { kind: numeric_unit,        prompt_key: solve_vth,                answer: { value: "30" }, unit: V }
    9:  { kind: drawing_task,        prompt_key: isc_drawing,              answer: {} }
    10: { kind: labeled_equations,   prompt_key: mesh_equations,           answer: { equations: ["5*I1 + 20*(I1 - I2) = 9", "20*(I2 - I1) + 25*I2 + 60*(I2 - I3) = 0", "60*(I3 - I2) + 10*I3 = 0"] } }
    11: { kind: numeric_unit,        prompt_key: solve_isc,                answer: { value: "1.5" }, unit: A }
    12: { kind: priors_then_input,   prompt_key: solve_rth,                answer: { value: "20" }, priors: ["Vth = 30 V", "Isc = 1.5 A"], unit: Ω }

# =============================================================================
# PROFILE 2 — "exploring" — 11 steps
# Figma: Profile Prototypes (Copy) → section "Profile 2" (node 29:422)
#
# QUICK SUMMARY — what to copy from Profile 1 (profile1Steps in mockSteps.ts):
#   P2 | P1 | copy_answer | copy_feedback | copy_prompt | kind_changed | notes
#   ---+----+-------------+---------------+-------------+--------------+------
#    1 |  2 | yes         | yes           | yes         | no           | P1 step 1 dropped
#    2 |  3 | yes         | no (Figma)    | yes         | YES          | text → diagram click
#    3 |  — | —           | —             | —           | —            | NEW method MCQ
#    4 |  6 | yes         | yes           | yes         | no           | P1 steps 4–5 dropped
#    5 |  7 | yes         | yes           | yes         | no           | Figma 2-phase UI merged
#    6 |  8 | yes         | yes           | yes         | no           |
#    7 |  — | —           | —             | —           | —            | NEW Rth-method MCQ
#    8 |  9 | yes         | yes           | yes         | no           | helperText differs
#    9 | 10 | yes         | yes           | yes         | no           |
#   10 | 11 | yes         | yes           | yes         | no           |
#   11 | 12 | yes         | yes           | yes         | no           |
#
# dropped_vs_profile_1: [1, 4, 5] — Thévenin model MCQ, ground node, essential-node count
# =============================================================================
profile_2:
  learner_profile: exploring
  total_steps: 11
  dropped_vs_profile_1: [1, 4, 5]
  figma_file_key: qWB8UPBr4Us99ABkRspWRQ

  steps:
    - number: 1
      kind: multi_value
      reuse_from_profile1:
        step: 2
        copy_answer: true
        copy_feedback: true
        copy_prompt: true
        kind_changed: false
        notes: Same question as P1 step 2; P1 step 1 (model MCQ) is dropped in Profile 2.
      figma_frame: profile 2 step 1
      prompt: Identify 2 values for Thevenin equivalent
      actionLabel: Check Solution
      inputs:
        - { label: "VALUE 1" }
        - { label: "VALUE 2" }
      answer: { values: [Vth, Rth] }
      feedback:
        title: Excellent
        body: 'For every Thevenin equivalent problem we need to find $V_{\mathrm{th}}$ and $R_{\mathrm{th}}$'

    - number: 2
      kind: select_in_diagram
      reuse_from_profile1:
        step: 3
        profile1_kind: multi_value
        copy_answer: true
        copy_feedback: false
        copy_prompt: true
        kind_changed: true
        notes: Same objective as P1 step 3 (Vth = Vab) but P2 uses diagram click; feedback from Figma P2 checked frame.
      figma_frame: profile 2 step 2
      prompt: "Let's start from finding $V_{\\mathrm{th}}$.\nWhere is $V_{\\mathrm{th}}$ in our diagram?"
      helperText: 'Select the $V_{\mathrm{th}}$ in the circuit diagram below.'
      actionLabel: Confirm Selection
      overlay: highlight_terminals_ab
      answer: { overlay: highlight_terminals_ab }
      feedback:
        title: Excellent
        body: 'Find $V_{\mathrm{th}}$ is the same to find $V_{ab}$'

    - number: 3
      kind: mcq
      mcq_style: method_text
      reuse_from_profile1: null
      figma_frame: profile 2 step 3
      notes: Profile-2-only question — method picker (Nodal / Mesh / Source Transformation). No P1 equivalent.
      prompt: Select Your Method
      helperText: 'Which analysis method will you use to find $V_{\mathrm{th}}$?'
      actionLabel: Confirm Method
      method_options:
        - { key: A, label: Nodal Analysis, sublabel: Apply KCL at nodes to find voltage }
        - { key: B, label: Mesh Analysis, sublabel: Apply KVL to mesh currents }
        - { key: C, label: Source Transformation, sublabel: Simplify circuit by converting sources }
      answer: { selectedIndex: 0 }
      feedback:
        title: Good
        body: 'Nodal analysis is a solid choice for finding $V_{\mathrm{th}}$.'

    - number: 4
      kind: numeric_plain
      reuse_from_profile1:
        step: 6
        copy_answer: true
        copy_feedback: true
        copy_prompt: true
        kind_changed: false
        notes: Same as P1 step 6; P1 steps 4–5 (ground + essential nodes) are dropped in Profile 2.
      figma_frame: profile 2 step 4
      prompt: 'How many KCL equations do we need to solve for $V_{\mathrm{th}}$'
      helperText: "Enter the number of equations we need:"
      actionLabel: Check Solution
      answer: { value: "2" }
      feedback:
        title: Correct
        body: With ground chosen, the two unknown node voltages need 2 KCL equations.

    - number: 5
      kind: labeled_equations
      reuse_from_profile1:
        step: 7
        copy_answer: true
        copy_feedback: true
        copy_prompt: true
        kind_changed: false
        notes: Same as P1 step 7; Figma shows two UI phases (KCL 1 then KCL 1+2) merged into one step here.
      figma_frame: profile 2 step 5 phase 1 + phase 2
      prompt: Now set up your KCL equation at the highlighted node
      actionLabel: Check Solution
      prefix: KCL
      circuitOverlay: highlight_node_va
      equation_count: 2
      answer:
        equations:
          - "(VA-9)/20+(VA-VB)/60-1.8=0"
          - "(VB-VA)/60+VB/25+VB/10=0"
      feedback:
        title: Excellent
        body: Both node equations look right — solve them simultaneously next.

    - number: 6
      kind: numeric_unit
      reuse_from_profile1:
        step: 8
        copy_answer: true
        copy_feedback: true
        copy_prompt: true
        kind_changed: false
      figma_frame: profile 2 step 6
      prompt: 'Great, now solve the previous three KCL equations and get your value for $V_{\mathrm{th}}$.'
      helperText: 'Calculate the $V_{\mathrm{th}}$(remember $V_{\mathrm{th}} = V_a - V_b$)'
      actionLabel: Check Solution
      fieldLabel: 'Value of $V_{\mathrm{th}}$:'
      leftLabel: '$V_{\mathrm{th}} =$'
      unit: V
      placeholder: "0.00"
      answer: { value: "30" }
      feedback:
        title: Excellent
        body: '$V_{\mathrm{th}} = 30\,\mathrm{V}$ — that matches the open-circuit voltage across terminals a–b.'

    - number: 7
      kind: mcq
      mcq_style: method_text
      reuse_from_profile1: null
      figma_frame: profile 2 step 7
      notes: Profile-2-only question — Rth method picker (Isc / dead-network / source transformation). No P1 equivalent.
      prompt: 'Nice! Now we need to find $R_{\mathrm{th}}$ using one of the following methods'
      helperText: "Select your method:"
      actionLabel: Confirm Method
      method_options:
        - { key: A, label: 'Use $I_{\mathrm{sc}}$ (Short-circuit current)', sublabel: 'Find short-circuit current, then $R_{\mathrm{th}} = V_{\mathrm{th}} / I_{\mathrm{sc}}$' }
        - { key: B, label: Dead-network analysis, sublabel: Deactivate all sources and find equivalent resistance }
        - { key: C, label: Source Transformation, sublabel: Simplify circuit by converting sources }
      answer: { selectedIndex: 0 }
      feedback:
        title: Good
        body: 'The $I_{\mathrm{sc}}$ method pairs well with the $V_{\mathrm{th}}$ you already found.'

    - number: 8
      kind: drawing_task
      reuse_from_profile1:
        step: 9
        copy_answer: true
        copy_feedback: true
        copy_prompt: true
        kind_changed: false
        notes: Same as P1 step 9; helperText wording differs slightly in Figma (sketchpad vs interactive canvas).
      figma_frame: profile 2 step 8
      prompt: 'Before we can find $R_{\mathrm{th}}$, we need to find $I_{\mathrm{sc}}$.'
      helperText: "Using the sketchpad on the right, redraw the circuit diagram and label all mesh currents/node voltages needed to determine the short-circuit current."
      actionLabel: Check Drawing
      answer: {}
      feedback:
        title: Nice sketch
        body: 'Your relabeled diagram shows the three mesh loops needed for $I_{\mathrm{sc}}$.'

    - number: 9
      kind: labeled_equations
      reuse_from_profile1:
        step: 10
        copy_answer: true
        copy_feedback: true
        copy_prompt: true
        kind_changed: false
      figma_frame: profile 2 step 9 phase 1
      prompt: Now set up the mesh current equations for the circuit above
      actionLabel: Check Equations
      prefix: MESH
      circuitOverlay: mesh_loops
      equation_count: 3
      answer:
        equations:
          - "5*I1 + 20*(I1 - I2) = 9"
          - "20*(I2 - I1) + 25*I2 + 60*(I2 - I3) = 0"
          - "60*(I3 - I2) + 10*I3 = 0"
      feedback:
        title: Great
        body: 'All three mesh equations are valid — solve for $I_3$ to get $I_{\mathrm{sc}}$.'

    - number: 10
      kind: numeric_unit
      reuse_from_profile1:
        step: 11
        copy_answer: true
        copy_feedback: true
        copy_prompt: true
        kind_changed: false
      figma_frame: profile 2 step 10
      prompt: 'Great, now solve and enter your value for $I_{\mathrm{sc}}$.'
      helperText: 'Calculate the short-circuit current.(Think about what''s the relation of $I_{\mathrm{sc}}$ and $I_1$, $I_2$, and $I_3$)'
      actionLabel: Check Solution
      fieldLabel: 'Final value of $I_{\mathrm{sc}}$:'
      leftLabel: '$I_{\mathrm{sc}} =$'
      unit: A
      placeholder: "0.00"
      answer: { value: "1.5" }
      feedback:
        title: Right
        body: '$I_{\mathrm{sc}} = 1.5\,\mathrm{A}$ — exactly the current through the shorted terminals.'

    - number: 11
      kind: priors_then_input
      reuse_from_profile1:
        step: 12
        copy_answer: true
        copy_feedback: true
        copy_prompt: true
        kind_changed: false
      figma_frame: profile 2 step 11
      prompt: 'Great, now solve and enter your value for $R_{\mathrm{th}}$.'
      helperText: 'Recall the values for $V_{\mathrm{th}}$ and $I_{\mathrm{sc}}$ you got before then calculate the final equivalent resistance.'
      actionLabel: Check Solution
      priors: ['$V_{\mathrm{th}} = 30\,\mathrm{V}$', '$I_{\mathrm{sc}} = 1.5\,\mathrm{A}$']
      fieldLabel: 'Final value of $R_{\mathrm{th}}$:'
      leftLabel: '$R_{\mathrm{th}} =$'
      unit: Ω
      placeholder: "0.00"
      answer: { value: "20" }
      feedback:
        title: Excellent
        body: '$R_{\mathrm{th}} = V_{\mathrm{th}} / I_{\mathrm{sc}} = 30 / 1.5 = 20\,\Omega$. The Thévenin equivalent is complete.'

